name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify server starts
        run: |
          node src/server.js &
          sleep 3
          curl -sf http://localhost:3000/api/metrics | head -c 200
          echo ""
          echo "API responding correctly"
          kill %1
